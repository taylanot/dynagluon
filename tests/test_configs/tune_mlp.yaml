default:
  train:
    target_column: "target"
    save_path: "AutogluonModels/temp_mlp"
    autogluon_fit_kwargs:
      time_limit: 60
      presets: "optimize_for_deployment"
      ag_args_ensemble:
        fold_fitting_strategy: "sequential_local"
      hyperparameters:
        NN_TORCH:
          num_epochs: 2
          learning_rate:
            _target_: "autogluon.common.space.Real"
            lower: 0.0001
            upper: 0.1
            log: True
      hyperparameter_tune_kwargs:
        searcher: "random"
        scheduler: "local"
        num_trials: 2
