[project]
dependencies = ["autogluon-tabular[all]>=1.6.3,<2", "dynaconf>=3.3.5,<4"]
name = "dynagluon"
requires-python = ">=3.9, <3.12"
version = "0.1.0"

[project.scripts]
dynagluon = "dynagluon.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-aarch64", "linux-64"]


[tool.pixi.pypi-dependencies]
dynagluon = { path = ".", editable = true }

[tool.pixi.tasks]
