[project]
dependencies = ["autogluon-tabular[all]>=1.6.3,<2", "dynaconf>=3.3.5,<4"]
name = "dynagluon"
requires-python = ">=3.9, <3.12"
version = "0.1.0"

[project.scripts]
dynagluon = "dynagluon.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-aarch64","linux-64"]


[tool.pixi.pypi-dependencies]
dynagluon = { path = ".", editable = true }

[tool.pixi.environments]
test = { features = ["test"] }
lint = { features = ["lint"], no-default-feature = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"

[tool.pixi.feature.test.pypi-dependencies]
scikit-learn = "*"
pandas = "*"

[tool.pixi.feature.test.tasks]
test = "pytest tests/ --cov=src/dynagluon --cov-report=term-missing"

[tool.pixi.feature.lint.dependencies]
python = ">=3.9, <3.12"
ruff = "*"

[tool.pixi.feature.lint.pypi-dependencies]
ty = "*"

[tool.pixi.feature.lint.tasks]
lint = "ruff check"
format = "ruff format"
typecheck = "ty check"

[tool.pixi.tasks]
