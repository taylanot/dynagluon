logging:
  version: 1
  disable_existing_loggers: false

  # Format of the log messages
  formatters:
    standard:
      format: "%(asctime)s [%(levelname)s] [%(name)s] %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"

  # Where logs should go
  handlers:
    # 1. Terminal output
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: standard
      stream: ext://sys.stdout

    # 2. File output (auto-rotates when file reaches 10MB, keeps last 3 files)
    file:
      class: logging.handlers.RotatingFileHandler
      level: DEBUG  # Capture more detailed debug logs in the file!
      formatter: standard
      filename: dynagluon.log
      maxBytes: 10485760 # 10 MB
      backupCount: 3
      encoding: utf8

  # Silence noisy third-party ML libraries
  loggers:
    ray:
      level: WARNING
      propagate: false
    urllib3:
      level: WARNING
      propagate: false

  # Root logger connects both handlers
  root:
    level: INFO
    handlers: [console, file]
